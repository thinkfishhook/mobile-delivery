name: Connector review prototype
on:
  workflow_dispatch:
    inputs:
      before:
        description: Exact first-parent commit (40 hex)
        type: string
        required: true
      after:
        description: Exact source commit to review (40 hex)
        type: string
        required: true
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write, pull-requests: write, issues: write }
    concurrency: { group: connector-review-prototype, queue: max, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Request one exact review through disposable branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: node internal/connector-prototype.mjs
