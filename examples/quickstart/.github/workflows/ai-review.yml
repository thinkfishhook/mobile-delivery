name: AI Code Review
on:
  push:
    branches: [main]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, issues: write }
    concurrency: { group: mobile-delivery-ai-review, queue: max, cancel-in-progress: false }
    steps:
      - uses: thinkfishhook/mobile-delivery/ai-review@2d03ee4e318219a69ef1a8899a8d064138779b58 # reviewed v1.1.1 implementation candidate; replace with stable SHA after publication
        with:
          branch: main
          provider: codex
          model: ${{ vars.AI_REVIEW_MODEL }} # CHANGE ME: set an explicit supported model in repository variables
          provider-api-key: ${{ secrets.OPENAI_API_KEY }}
