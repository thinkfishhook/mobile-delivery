name: Continuous Integration
on:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: macos-26 # CHANGE ME: hosted macOS or existing self-hosted labels
    timeout-minutes: 330
    environment: { name: ios-delivery, deployment: false }
    permissions: { contents: write, actions: write, issues: write }
    concurrency: { group: ios-delivery, queue: max, cancel-in-progress: false }
    steps:
      - uses: thinkfishhook/mobile-delivery/ci@2d03ee4e318219a69ef1a8899a8d064138779b58 # reviewed v1.1.1 implementation candidate; replace with stable SHA after publication
        with:
          branch: main
          ci-workflow: ci.yml
          delivery-enabled: ${{ vars.IOS_DELIVERY_ENABLED }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
          distribution-p12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          distribution-p12-password: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          provisioning-profile: ${{ secrets.IOS_PROFILE_BASE64 }}
  report:
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: read, checks: read, issues: write }
    concurrency: { group: mobile-delivery-reporting, queue: max, cancel-in-progress: false }
    steps:
      - uses: thinkfishhook/mobile-delivery/report-failure@2d03ee4e318219a69ef1a8899a8d064138779b58 # reviewed v1.1.1 implementation candidate; replace with stable SHA after publication
        with:
          role: ci
          operation-job: ci
          integration-branch: main
