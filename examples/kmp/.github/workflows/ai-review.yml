name: AI Code Review
on:
  push:
    branches: [trunk]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, issues: write }
    concurrency: { group: mobile-delivery-ai-review, queue: max, cancel-in-progress: false }
    steps:
      - uses: thinkfishhook/mobile-delivery/ai-review@5abb5ee2bb1e24428cdac9e0ecd1659abd092f3a # reviewed v1.1.1 implementation candidate; replace with stable SHA after publication
        with:
          branch: trunk
          provider: codex
          model: ${{ vars.AI_REVIEW_MODEL }} # CHANGE ME: set an explicit supported model in repository variables
          provider-api-key: ${{ secrets.OPENAI_API_KEY }}
