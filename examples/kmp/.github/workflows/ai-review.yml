name: AI Code Review
on:
  push:
    branches: [trunk]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, issues: write }
    concurrency: { group: mobile-delivery-ai-review, queue: max, cancel-in-progress: false }
    steps:
      - uses: thinkfishhook/mobile-delivery/ai-review@d0b62a1a9b8e3f531c0ffbb97629a452cffc0268 # v1.1.0 baseline; replace all pins with v1.1.1 before use (unreleased permission patch)
        with:
          branch: trunk
          provider: codex
          model: ${{ vars.AI_REVIEW_MODEL }} # CHANGE ME: set an explicit supported model in repository variables
          provider-api-key: ${{ secrets.OPENAI_API_KEY }}
